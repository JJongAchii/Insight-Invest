# Insight-Invest 인프라 전체 (재구조 2026-07) — 순수 CloudFormation, SAM CLI 불필요.
# 배포:
#   aws cloudformation deploy --stack-name insight-invest-api \
#     --template-file infra/template.yaml --capabilities CAPABILITY_IAM \
#     --parameter-overrides ImageUri=<ECR>@<digest> ApiToken=<token>
#
# 이것이 앱의 유일한 클라우드 자원이다: Lambda 1개 + Function URL.
# (S3 버킷 insight-invest-datalake와 ECR 레포는 기존 자원 재사용 — 스택 밖)

AWSTemplateFormatVersion: "2010-09-09"
Description: Insight-Invest API - Lambda container + Function URL (qdata consumer)

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (digest 고정 권장)
  ApiToken:
    Type: String
    NoEcho: true
    Description: X-API-Key 헤더 토큰 (앱 레벨 인증)
  SiteAccessHash:
    Type: String
    Default: "2156aefb8c63d4b601f8354ea392867fd552dae01233f8efd5f739e3e1cdeb5b"
    Description: 개인 접근 코드 SHA-256 (원문은 배포 환경과 코드에 저장하지 않음)
  DataBucket:
    Type: String
    Default: insight-invest-datalake
  KrxId:
    Type: String
    NoEcho: true
    Description: KRX 정보데이터시스템 로그인 ID (폴러 전용)
  KrxPw:
    Type: String
    NoEcho: true
    Description: KRX 정보데이터시스템 로그인 PW (폴러 전용)
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 뉴스 큐레이션용 Anthropic API 키 (뉴스 폴러 전용 — 없으면 규칙 폴백)
  WebPushPublicKey:
    Type: String
    Default: ""
    Description: VAPID public key (base64url, 없으면 Web Push 비활성)
  WebPushPrivateKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: VAPID private key (base64url)
  WebPushSubject:
    Type: String
    Default: "mailto:admin@insight-invest.local"
    Description: VAPID contact subject

Resources:
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: data-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow  # qdata 미러·메타·아카이브 읽기
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}
                  - !Sub arn:aws:s3:::${DataBucket}/qdata/*
                  - !Sub arn:aws:s3:::${DataBucket}/app/*
              - Effect: Allow  # 포트폴리오 저장 + 백테스트 임시결과 (read-modify-write)
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}/app/portfolio/*
                  - !Sub arn:aws:s3:::${DataBucket}/app/tmp_results/*
                  - !Sub arn:aws:s3:::${DataBucket}/app/watchlist.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/holdings.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/action_states.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/notification_subscriptions.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/notification_deliveries.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/decision_journal.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/decision_journal_reviews.parquet

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: insight-invest-api
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Role: !GetAtt ApiRole.Arn
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 120
      Environment:
        Variables:
          QDATA_LAKE: !Sub s3://${DataBucket}/qdata
          APP_DATA: !Sub s3://${DataBucket}/app
          API_TOKEN: !Ref ApiToken
          SITE_ACCESS_HASH: !Ref SiteAccessHash
          WEB_PUSH_PUBLIC_KEY: !Ref WebPushPublicKey
          WEB_PUSH_PRIVATE_KEY: !Ref WebPushPrivateKey
          WEB_PUSH_SUBJECT: !Ref WebPushSubject

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE  # 인증은 앱 레벨 X-API-Key (Vercel 브라우저 호출이라 IAM 서명 불가)

  # 2025-10부터 신규 Function URL은 InvokeFunctionUrl + InvokeFunction 둘 다 필요
  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true  # URL 경유 호출만 허용 (직접 invoke 차단)

  PollerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: intraday-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow  # 미러(업종·전일 지수) 읽기
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}
                  - !Sub arn:aws:s3:::${DataBucket}/qdata/*
                  - !Sub arn:aws:s3:::${DataBucket}/app/*
              - Effect: Allow  # 장중 스냅샷 2파일만 쓰기 (스펙 불변식 1)
                Action: [s3:PutObject]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}/app/kr_intraday_latest.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/kr_intraday_timeline.parquet

  IntradayPollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: insight-invest-intraday-poller
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      ImageConfig: { Command: ["app.intraday_poller.handler"] }
      Role: !GetAtt PollerRole.Arn
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          QDATA_LAKE: !Sub s3://${DataBucket}/qdata
          APP_DATA: !Sub s3://${DataBucket}/app
          KRX_ID: !Ref KrxId
          KRX_PW: !Ref KrxPw

  # 09:05~15:35 KST 30분 간격 (UTC 00:05~06:35) — 15:35 폴이 마감치 캡처
  IntradayPollerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: insight-invest-intraday-poll
      ScheduleExpression: cron(5,35 0-6 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt IntradayPollerFunction.Arn
          Id: intraday-poller

  IntradayPollerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IntradayPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IntradayPollerSchedule.Arn

  NewsPollerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: news-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow  # 뉴스 브리핑 1파일만 쓰기 (스펙 §9-1 — 읽기 불필요)
                Action: [s3:PutObject]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}/app/news_briefing.json

  NewsPollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: insight-invest-news-poller
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      ImageConfig: { Command: ["app.news_poller.handler"] }
      Role: !GetAtt NewsPollerRole.Arn
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          APP_DATA: !Sub s3://${DataBucket}/app
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey

  # 주중 09~19시 KST 매시 정각 (UTC 00~10시) — 08시는 UTC 자정을 넘어 별도 룰
  NewsPollerScheduleDay:
    Type: AWS::Events::Rule
    Properties:
      Name: insight-invest-news-poll-day
      ScheduleExpression: cron(0 0-10 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NewsPollerFunction.Arn
          Id: news-poller-day

  # 주중 08시 KST = 전날 23시 UTC (월 08시 = 일 23시 UTC → SUN-THU)
  NewsPollerScheduleDawn:
    Type: AWS::Events::Rule
    Properties:
      Name: insight-invest-news-poll-dawn
      ScheduleExpression: cron(0 23 ? * SUN-THU *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NewsPollerFunction.Arn
          Id: news-poller-dawn

  NewsPollerDayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NewsPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NewsPollerScheduleDay.Arn

  NewsPollerDawnInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NewsPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NewsPollerScheduleDawn.Arn

  ActionPollerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: action-notifications
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}
                  - !Sub arn:aws:s3:::${DataBucket}/qdata/*
                  - !Sub arn:aws:s3:::${DataBucket}/app/*
              - Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - !Sub arn:aws:s3:::${DataBucket}/app/notification_subscriptions.parquet
                  - !Sub arn:aws:s3:::${DataBucket}/app/notification_deliveries.parquet

  ActionPollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: insight-invest-action-poller
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      ImageConfig: { Command: ["app.action_poller.handler"] }
      Role: !GetAtt ActionPollerRole.Arn
      Architectures: [x86_64]
      MemorySize: 1536
      Timeout: 120
      Environment:
        Variables:
          QDATA_LAKE: !Sub s3://${DataBucket}/qdata
          APP_DATA: !Sub s3://${DataBucket}/app
          WEB_PUSH_PUBLIC_KEY: !Ref WebPushPublicKey
          WEB_PUSH_PRIVATE_KEY: !Ref WebPushPrivateKey
          WEB_PUSH_SUBJECT: !Ref WebPushSubject

  # 가격·인사이트 배치가 끝난 뒤 실행한다. 중복 전송은 delivery receipt가 막는다.
  ActionPollerScheduleMorning:
    Type: AWS::Events::Rule
    Properties:
      Name: insight-invest-action-poll-morning
      ScheduleExpression: cron(45 0 ? * MON-FRI *)  # 09:45 KST
      State: ENABLED
      Targets:
        - Arn: !GetAtt ActionPollerFunction.Arn
          Id: action-poller-morning

  ActionPollerScheduleEvening:
    Type: AWS::Events::Rule
    Properties:
      Name: insight-invest-action-poll-evening
      ScheduleExpression: cron(30 11 ? * MON-FRI *)  # 20:30 KST
      State: ENABLED
      Targets:
        - Arn: !GetAtt ActionPollerFunction.Arn
          Id: action-poller-evening

  ActionPollerMorningInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ActionPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ActionPollerScheduleMorning.Arn

  ActionPollerEveningInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ActionPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ActionPollerScheduleEvening.Arn

Outputs:
  FunctionUrl:
    Value: !GetAtt ApiUrl.FunctionUrl
