# API 배포 — 서버 코드 변경 시 Lambda 컨테이너 재빌드·재배포 (재구조 2026-07)
#
# 필요한 repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — ECR push + CFN deploy 권한
#   GH_PAT                                     — quant-data(private) 읽기용 PAT
#   API_TOKEN                                  — X-API-Key 앱 토큰
#   OPENAI_API_KEY                             — Research GPT-5 mini 요약·원문 검수
#   WEB_PUSH_PUBLIC_KEY / WEB_PUSH_PRIVATE_KEY  — VAPID 키 (없으면 Push 비활성)

name: deploy-api

on:
  push:
    branches: [main]
    paths: ["server/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy production, or qualify research without deploying
        type: choice
        options: [deploy, research-qualify]
        default: deploy
      qdata_ref:
        description: Exact quant-data commit for research qualification (40 hex characters)
        type: string
      research_max_items:
        description: Maximum qualification cards (1 to 30)
        type: string
        default: "1"
      research_sources:
        description: Approved source IDs, comma separated; blank uses all enabled editorial sources
        type: string
        default: "aqr-research"
      research_model:
        description: Isolated qualification model only; mini is limited to 3 distinct sources
        type: choice
        options: [gpt-5-nano, gpt-5-mini]
        default: gpt-5-mini
      research_sample:
        description: Fixed public-source regression or reading-value sample; no silent replacement
        type: choice
        options: [latest, reading-value-v1, reading-value-v2, reading-diversity-v1, v7-regression]
        default: latest

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: insight-invest-api

jobs:
  research-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'research-qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: research-openai-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned producer reference
        env:
          QDATA_REF: ${{ inputs.qdata_ref }}
        run: '[[ "$QDATA_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: JJongAchii/quant-data
          ref: ${{ inputs.qdata_ref }}
          token: ${{ secrets.GH_PAT }}
          path: qualification-qdata
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification dependencies
        run: pip install './qualification-qdata[s3]' httpx
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Qualify real reading briefs in an isolated prefix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_DATA: s3://insight-invest-datalake/research-radar/qualification/openai
          RADAR_ANALYSIS_ENABLED: "true"
          RADAR_ANALYSIS_MONTHLY_BUDGET_USD: "0.50"
          RESEARCH_MAX_ITEMS: ${{ inputs.research_max_items }}
          RESEARCH_SOURCES: ${{ inputs.research_sources }}
          RESEARCH_QUALIFICATION_MODEL: ${{ inputs.research_model }}
          RESEARCH_SAMPLE: ${{ inputs.research_sample }}
          QDATA_REF: ${{ inputs.qdata_ref }}
        run: python scripts/qualify_research_editorial.py --output qualification-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-report.json
          retention-days: 14
          if-no-files-found: warn
  deploy:
    if: github.event_name == 'push' || inputs.mode != 'research-qualify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          echo "${{ secrets.GH_PAT }}" > /tmp/ghtoken
          DOCKER_BUILDKIT=1 docker build \
            --secret id=gh_token,src=/tmp/ghtoken \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }} server/
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }}
          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPO \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/$ECR_REPO@$DIGEST" >> $GITHUB_ENV

      - name: Wait for protected web proxy
        run: |
          for attempt in $(seq 1 40); do
            BODY=$(curl -fsS https://insight-invest-ten.vercel.app/api/auth/status || true)
            if echo "$BODY" | grep -q '"proxyReady":true'; then
              echo "Vercel proxy is ready"
              exit 0
            fi
            echo "Waiting for Vercel proxy ($attempt/40)"
            sleep 15
          done
          echo "Vercel proxy did not become ready; refusing to tighten API access first"
          exit 1

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name insight-invest-api \
            --template-file infra/template.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides ImageUri=$IMAGE_URI ApiToken=${{ secrets.API_TOKEN }} \
              KrxId=${{ secrets.KRX_ID }} KrxPw=${{ secrets.KRX_PW }} \
              AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} \
              OpenAIApiKey=${{ secrets.OPENAI_API_KEY }} \
              WebPushPublicKey=${{ secrets.WEB_PUSH_PUBLIC_KEY }} \
              WebPushPrivateKey=${{ secrets.WEB_PUSH_PRIVATE_KEY }} \
              WebPushSubject=https://insight-invest-ten.vercel.app \
            --no-fail-on-empty-changeset

      - name: Smoke test
        run: |
          aws lambda invoke --function-name insight-invest-research-poller \
            /tmp/research-poller.json >/dev/null
          jq -e '.ok == true and .delivery_ready == true and (.projection.records > 0)' \
            /tmp/research-poller.json
          URL=$(aws cloudformation describe-stacks --stack-name insight-invest-api \
            --query 'Stacks[0].Outputs[?OutputKey==`FunctionUrl`].OutputValue' --output text)
          curl -sf "$URL/health" | grep healthy
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/meta" >/dev/null
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/regime/kr" >/tmp/regime-kr.json
          jq -e '
            .cpi_yoy.frequency == "monthly"
            and (.cpi_yoy.as_of | test("^[0-9]{4}-[0-9]{2}$"))
            and ([.base_rate, .ktb_3y, .ktb_10y, .usdkrw] | all(
              .source == "ECOS" and .frequency == "daily"
              and (.as_of | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
              and (.latest | type) == "number"))
          ' /tmp/regime-kr.json
          jq 'with_entries(.value |= {latest, as_of, frequency, source})' \
            /tmp/regime-kr.json > /tmp/regime-kr-snapshot.json
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/regime/gauge" >/tmp/regime-us.json
          jq -e '(.components | length) == 4 and (.components | all(
            (.as_of | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))))' /tmp/regime-us.json
          jq '{as_of, calculated_at, components: [.components[] | {name, as_of}]}' \
            /tmp/regime-us.json >/tmp/regime-us-snapshot.json
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/overview" >/tmp/market-overview.json
          jq -e '.data_status | length == 5' /tmp/market-overview.json
          jq '{data_status}' /tmp/market-overview.json >/tmp/market-data-status.json
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/intraday/market" >/tmp/intraday-market.json
          jq -e '(.active | type) == "boolean" and (.is_open | type) == "boolean"
            and (if .active then (.indices | type) == "array"
              and (.as_of | test("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$"))
            else .unavailable_reason == "stale" or .unavailable_reason == "missing"
              or .unavailable_reason == "empty" or .unavailable_reason == "inconsistent"
            end)' /tmp/intraday-market.json
          jq '{active, is_open, as_of, trade_date, unavailable_reason}' \
            /tmp/intraday-market.json >/tmp/intraday-availability.json
          INTRADAY_SECTOR=$(jq -r '.sectors[0].name // "기타"' /tmp/intraday-market.json)
          curl -sfG --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            --data-urlencode "sector=$INTRADAY_SECTOR" \
            "$URL/intraday/market" >/tmp/intraday-sector-members.json
          jq -e --arg sector "$INTRADAY_SECTOR" '
            if .active then
              .sector_detail.name == $sector
              and (.sector_detail.members | type) == "array"
              and (.sector_detail.members | all(
                (.ticker | type) == "string" and (.market == "KOSPI" or .market == "KOSDAQ")))
              and (.sector_detail.members | length) ==
                ([.sectors[] | select(.name == $sector) | .n][0] // 0)
            else .unavailable_reason == "stale" or .unavailable_reason == "missing"
              or .unavailable_reason == "empty" or .unavailable_reason == "inconsistent"
            end' /tmp/intraday-sector-members.json
          jq --arg sector "$INTRADAY_SECTOR" '{active, as_of, trade_date, unavailable_reason,
            sector: .sector_detail.name, member_count: (.sector_detail.members | length),
            summary: [.sectors[]? | select(.name == $sector)],
            sample_members: .sector_detail.members[:3]}' \
            /tmp/intraday-sector-members.json >/tmp/intraday-members-snapshot.json
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/insight/groups?kind=theme&market=ALL&period=1m" >/tmp/market-themes.json
          jq -e '(.rows | length) > 0 and (.rows | all(
            .kind == "theme" and .member_count > 0 and (.sources | length) > 0
            and .history_basis == "current_representatives"))' /tmp/market-themes.json
          GROUP_ID=$(jq -r '.rows[0].id | @uri' /tmp/market-themes.json)
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/insight/groups/detail?kind=theme&market=ALL&period=1m&group=$GROUP_ID" >/tmp/market-theme-detail.json
          jq -e --slurpfile overview /tmp/market-themes.json '
            .summary == $overview[0].rows[0]
            and (.members | length) == .summary.member_count
            and (.members | all(.meta_id != null and .ticker != null))
            and (.history | length) > 0' /tmp/market-theme-detail.json
          curl -sf --max-time 110 \
            -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/insight/groups?kind=sector&market=KOSPI&period=1d" >/tmp/market-sectors.json
          jq -e '(.rows | length) > 0 and (.rows | all(
            .kind == "sector" and .member_count > 0
            and .history_basis == "dated_classification"))' /tmp/market-sectors.json
          jq --slurpfile sectors /tmp/market-sectors.json '{
            as_of, theme_count: (.rows | length),
            themes: [.rows[] | {id, name, member_count, period_covered_count}],
            kospi_sector_count: ($sectors[0].rows | length)
          }' /tmp/market-themes.json >/tmp/market-groups-snapshot.json
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/research?lane=all&limit=1" | jq -e \
              '.total > 0 and (.items | length) == 1 and .read >= 0 and .saved >= 0
               and .view == "all" and .lane == "all" and .lane_counts.all > 0
               and (.items[0].is_saved | type) == "boolean"
               and (.items[0].research_lane == "core"
                    or .items[0].research_lane == "discovery"
                    or .items[0].research_lane == "context"
                    or .items[0].research_lane == "updates")'
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/research?limit=1" | jq -e \
              '.lane == "core"
               and (.items | all(.research_lane == "core"
                                  and (.notification_eligible | type) == "boolean"))'
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/research?view=saved&q=__deployment_smoke_no_match__&limit=1" | jq -e \
              '.view == "saved" and .query == "__deployment_smoke_no_match__"
               and (.items | length) == 0'
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/research/status" | jq -e \
              '(.initialized | type) == "boolean" and .unseen >= 0
               and (.generated_at | type) == "string"'
          curl -sf -H "X-API-Key: ${{ secrets.API_TOKEN }}" \
            -H "X-Site-Access: ${{ secrets.SITE_ACCESS_CODE }}" \
            "$URL/openapi.json" | jq -e \
              '.paths["/research/{entry_id}/saved"].put
               and .paths["/research/read/all"].put
               and .paths["/research/status"].get
               and .paths["/research/seen"].put
               and (.paths["/intraday/market"].get.parameters | any(.name == "sector"))'

      - name: Record deployed macro snapshot
        uses: actions/upload-artifact@v4
        with:
          name: regime-kr-snapshot
          path: /tmp/regime-kr-snapshot.json
          if-no-files-found: error

      - name: Record deployed market refresh status
        uses: actions/upload-artifact@v4
        with:
          name: market-data-status
          path: /tmp/market-data-status.json
          if-no-files-found: error

      - name: Record deployed US macro observation dates
        uses: actions/upload-artifact@v4
        with:
          name: regime-us-snapshot
          path: /tmp/regime-us-snapshot.json
          if-no-files-found: error

      - name: Record deployed sector and theme snapshot
        uses: actions/upload-artifact@v4
        with:
          name: market-groups-snapshot
          path: /tmp/market-groups-snapshot.json
          if-no-files-found: error

      - name: Record deployed intraday availability
        uses: actions/upload-artifact@v4
        with:
          name: intraday-availability
          path: /tmp/intraday-availability.json
          if-no-files-found: error

      - name: Record deployed intraday sector members
        uses: actions/upload-artifact@v4
        with:
          name: intraday-members-snapshot
          path: /tmp/intraday-members-snapshot.json
          if-no-files-found: error
