# isort 설정 — 퍼스트파티 패키지를 명시해 실행 위치 의존성을 없앤다.
#
# 이게 없으면 isort가 `datastore`/`module`/`app`을 서드파티로 오분류한다.
# 오분류는 cwd에 따라 갈린다 — repo root에서 실행하면 server/ 아래 디렉터리가
# 안 보여서 실패하고, server/에서 실행하면 통과한다. pre-commit은 repo root에서
# 돌기 때문에 이 파일이 없으면 훅과 수동 검사가 서로 다른 답을 낸다.
#
# profile/line_length는 .pre-commit-config.yaml의 args와 일치시킨다.
[settings]
profile = black
line_length = 100
known_first_party = app,datastore,module

# 가상환경·의존성은 검사 대상이 아니다. pre-commit은 스테이징된 파일만 넘기므로
# 훅 경로에서는 무해하지만, 수동으로 `isort server/`를 돌릴 때 결과가 같아야 한다.
extend_skip_glob = */.venv*/*,*/venv/*,*/node_modules/*
